name: Release Readiness (No Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Web and repository gates
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm run scan:secrets
          npm run check:load-scenarios
          npm audit --audit-level=high

      - name: Mobile gates
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run expo:doctor
          npm run export:ios
          node ../scripts/check-mobile-audit.mjs

      - name: Backend and Edge dry-run gates
        run: |
          npm run check:supabase-boundary
          npm run test:supabase-pglite
          deno fmt --check supabase/functions
          deno lint supabase/functions
          # Dynamic deno test set; the script rejects missing function tests.
          npm run test:supabase-functions
          # Dynamic deno check set over every discovered function entrypoint.
          npm run check:supabase-functions
          npm run scan:secrets

      - name: Create content-free evidence
        run: |
          mkdir -p release-evidence
          node -e 'require("node:fs").writeFileSync("release-evidence/result.txt", `sha=${process.env.GITHUB_SHA}\nstatus=local-gates-passed\ndeployed=false\nsubmitted=false\n`)'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fieldcraft-release-readiness-${{ github.sha }}
          path: release-evidence/result.txt
          if-no-files-found: error
          retention-days: 14

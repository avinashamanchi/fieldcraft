name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run scan:secrets
      - run: npm run check:load-scenarios
      - run: npm audit --audit-level=high

  mobile-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run expo:doctor
      - run: npm run export:ios
      - run: node ../scripts/check-mobile-audit.mjs
      - name: Scan exported bundle
        working-directory: .
        run: npm run scan:secrets

  backend-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run check:supabase-boundary
      - run: npm run test:supabase-pglite
      - run: deno fmt --check supabase/functions
      - run: deno lint supabase/functions
      - name: Run dynamic deno test function set
        run: npm run test:supabase-functions
      - name: Run dynamic deno check function set
        run: npm run check:supabase-functions

name: Setup Supabase Backend (Disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-deployment-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse retired schema provisioning
        run: |
          echo "::error::Migration deployment is intentionally disabled. Review and deploy the ordered supabase/migrations with a migration-aware release process."
          exit 1
